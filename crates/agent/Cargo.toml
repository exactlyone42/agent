[package]
name = "agent-platform-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/agent_platform_agent.rs"

[dependencies]
agent-harness.workspace = true
agent-harness-approval.workspace = true
agent-harness-capabilities.workspace = true
thiserror.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
