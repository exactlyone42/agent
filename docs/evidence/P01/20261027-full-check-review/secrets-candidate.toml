[extend]
useDefault = true

[[allowlists]]
description = "請求原件的 UUID 快取識別值，不是驗證憑證"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)docs/evidence/P01/[^/]+/(?:[^/]+/)?requests\.json$''']
regexTarget = "match"
regexes = ['''^prompt_cache_key"\s*:\s*"[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}"$''']
